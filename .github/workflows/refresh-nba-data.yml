# Step 3 of the NBA.com connectivity fix — see backend/AGENTS.md's "Player
# ratings: refresh strategy". Render's own network cannot reach stats.nba.com
# (confirmed with two independent data points: Oregon and Ohio Render regions
# both hard-fail identically after 4 retries at 40s each — not a regional
# issue, NBA.com is blocking cloud/datacenter IP ranges broadly). The original
# theory here was that GitHub-hosted runners' network would be a workaround —
# **confirmed wrong, not just untested**: every single scheduled run since
# this workflow was created failed the same way (64/64 runs, 2026-08-11
# through 2026-08-27), with the identical `stats.nba.com` read-timeout
# NBAClientError Render gets. GitHub Actions runners are Azure-hosted cloud
# IPs too, and NBA.com blocks those the same way. Left as manual-dispatch-only
# now (see `on:` below) rather than deleted outright — harmless to keep
# around in case NBA.com's blocking policy ever changes, but the schedule
# trigger was pure noise (a guaranteed-failing job 4x/day) for two-plus weeks
# straight. **The actual, working refresh path is local + commit** — see
# backend/AGENTS.md's "Player ratings: refresh strategy" — run the refresh_*
# scripts from a real residential connection (confirmed working repeatedly)
# and commit backend/outputs/*.json by hand.
#
# Does NOT touch refresh_player_ratings.py / refresh_team_style.py /
# refresh_player_projections.py — those are unchanged, already proven correct
# against real NBA.com data from a reachable network. This workflow only
# changes WHERE they run.
name: Scheduled NBA Data Refresh

on:
  # No schedule trigger — see the comment block above. Manual-only until/
  # unless there's real evidence NBA.com's cloud-IP block has lifted; don't
  # re-add a cron trigger without first confirming a manual workflow_dispatch
  # run actually succeeds.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # No version pin exists elsewhere in the repo (no runtime.txt/
          # .python-version) — 3.11 matches what's been used and verified
          # locally throughout this project, not an explicit requirement.
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Each refresh step is independent (continue-on-error) — matching
      # backend/api/main.py's refresh_if_stale, one source failing (e.g.
      # NBA.com rate-limits team_style's 10-season loop) must not stop the
      # others from refreshing and being committed. The final step below
      # still fails the job (visibly, in the Actions tab) if any of the
      # three failed, so a real problem doesn't go silent.
      - name: Refresh player power rankings
        id: refresh_player_ratings
        continue-on-error: true
        run: python -m backend.ratings.refresh_player_ratings

      - name: Refresh team style
        id: refresh_team_style
        continue-on-error: true
        run: python -m backend.ratings.refresh_team_style

      - name: Refresh player projections
        id: refresh_player_projections
        continue-on-error: true
        run: python -m backend.ratings.refresh_player_projections

      - name: Commit and push if data changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # refresh_team_style.py catches per-season fetch failures
          # internally ("partial coverage beats none") rather than raising,
          # so a total NBA.com outage doesn't crash the script — it just
          # writes a technically-valid 0-season file instead. That's the
          # right call for a live read, but wrong for something we're about
          # to commit as source: a committed 0-season file would silently
          # wipe out real historical data on diff. Only ever commit it with
          # at least one real team-season in it; any nonzero count (even a
          # genuinely partial one) is left alone, matching the script's own
          # "partial beats none" principle.
          if [ -f backend/outputs/team_style.json ]; then
            N_SEASONS=$(python3 -c "import json; print(json.load(open('backend/outputs/team_style.json'))['n_team_seasons'])")
            if [ "$N_SEASONS" -eq 0 ]; then
              echo "team_style.json has 0 team-seasons (every historical season's fetch failed this run) — not committing it."
              rm backend/outputs/team_style.json
            fi
          fi

          # A refresh step that failed outright (see continue-on-error
          # above) never wrote its output file at all — `git add` on a path
          # that doesn't exist errors out ("did not match any files"), so
          # only add files that are actually present, rather than assuming
          # all three ran.
          for f in backend/outputs/player_power_rankings.json backend/outputs/team_style.json backend/outputs/player_projections.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No data changes since last successful refresh — nothing to commit."
          else
            git commit -m "Scheduled NBA data refresh [skip ci]"
            git push
          fi

      - name: Fail job if any refresh script failed
        if: always()
        run: |
          if [ "${{ steps.refresh_player_ratings.outcome }}" = "failure" ] || \
             [ "${{ steps.refresh_team_style.outcome }}" = "failure" ] || \
             [ "${{ steps.refresh_player_projections.outcome }}" = "failure" ]; then
            echo "At least one refresh script failed this run — see its step above for the traceback."
            echo "Any scripts that succeeded were still committed/pushed."
            exit 1
          fi
